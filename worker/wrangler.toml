name = "imageuploader-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# GitHub Pages の「オリジン」のみ（パス・末尾スラッシュは付けない）。
# ブラウザの Origin ヘッダはスキーム+ホストだけなので、パスを付けると CORS で一致せず弾かれる。
ALLOWED_ORIGIN = "https://mk-work-labs.github.io"
# /list で受け付ける店舗フォルダの許可リスト（カンマ区切り）。
# 店舗を増やすときはここにフォルダを足して再デプロイする。
ALLOWED_FOLDERS = "/fivem,/mochimochi"
